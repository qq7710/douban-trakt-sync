services:
  douban-trakt-sync:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./token.json:/app/token.json:ro
      # 以下两个状态文件必须持久化，否则容器重启后：
      #   synced.json      -> 会把看过的条目重新推回待看
      #   watch_state.json -> 会把所有老条目当成新增，白跑一轮全量
      # 首次启动前请先执行：touch synced.json watch_state.json
      #                    （否则 Docker 会把它建成目录）
      - ./synced.json:/app/synced.json
      - ./watch_state.json:/app/watch_state.json
    # 容器内跑 watch_sync.py 探测模式，默认 30 秒一轮。
    # 调频率改 config.json 的 watch.interval（秒）。
